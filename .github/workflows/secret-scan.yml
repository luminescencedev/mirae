# Secret scanning (TRUST-016). Gitleaks scans the diff on PRs and the full
# history on pushes to main. Pair with GitHub's native secret scanning + push
# protection (enable in repo Settings → Code security) for defence in depth.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
