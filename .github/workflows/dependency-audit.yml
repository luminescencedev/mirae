# Dependency vulnerability scan (TRUST-015). Runs pnpm audit on PRs, pushes to
# main, and weekly. Fails on high/critical advisories; lower severities are
# surfaced but non-blocking. Dependabot (see .github/dependabot.yml) opens the
# upgrade PRs.
name: dependency-audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit (high + critical block)
        run: pnpm audit --prod --audit-level high
      - name: Full advisory report (non-blocking)
        if: always()
        run: pnpm audit || true
