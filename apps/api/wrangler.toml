# Mirae — single Cloudflare Worker.
# Hono (src/index.ts) is the Worker `main`: it handles /api/* and /health,
# and serves the built Vite SPA (apps/web/dist) via the ASSETS binding.
name = "mirae"
main = "src/index.ts"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

# Static assets = the built web app. `run_worker_first` lets Hono see every
# request (so /api/* and OG bot-detection on /@:handle run before asset
# serving); the Worker falls back to the ASSETS binding for the SPA.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

# Custom domains — one Worker serves both hosts; host-split routing in
# src/index.ts sends the dashboard to app.usemirae.com and the marketing +
# public pages to usemirae.com. Cloudflare provisions DNS + TLS automatically.
[[routes]]
pattern = "app.usemirae.com"
custom_domain = true

[[routes]]
pattern = "usemirae.com"
custom_domain = true

# Commission files (references, WIP, deliverables). Local `wrangler dev`
# simulates this bucket; provision the real one with:
#   wrangler r2 bucket create mirae-files
[[r2_buckets]]
binding = "FILES"
bucket_name = "mirae-files"

# Rate limiting (see src/lib/rate-limit.ts). 20 requests / 60s per (path, IP)
# on the public write + token-scoped surfaces. period must be 10 or 60.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Daily orphaned-R2-object sweep (see src/lib/cleanup.ts).
[triggers]
crons = ["0 3 * * *"]

[dev]
port = 8787
