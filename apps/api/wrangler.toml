# Mirae — single Cloudflare Worker.
# Hono (src/index.ts) is the Worker `main`: it handles /api/* and /health,
# and serves the built Vite SPA (apps/web/dist) via the ASSETS binding.
name = "mirae"
main = "src/index.ts"
compatibility_date = "2026-07-08"
compatibility_flags = ["nodejs_compat"]

# Static assets = the built web app. `run_worker_first` lets Hono see every
# request (so /api/* and OG bot-detection on /@:handle run before asset
# serving); the Worker falls back to the ASSETS binding for the SPA.
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

[dev]
port = 8787
